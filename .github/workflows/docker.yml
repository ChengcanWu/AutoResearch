# 本机没有 Docker Desktop 时，用这份工作流留下「docker build / run」输出。
name: docker

on:
  workflow_dispatch:
  push:
    paths:
      - ResearchGuide-main/Dockerfile
      - ResearchGuide-main/docker-compose.yml
      - .github/workflows/docker.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ResearchGuide-main
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t qiyan:ci .
      - name: docker run and /api/health
        run: |
          docker run --rm -d --name qiyan-ci -p 8100:8100 qiyan:ci
          ok=0
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8100/api/health; then
              echo
              ok=1
              break
            fi
            sleep 2
          done
          docker logs qiyan-ci || true
          docker stop qiyan-ci || true
          test "$ok" = 1
