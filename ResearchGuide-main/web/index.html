<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>启研 · AI 科研导师</title>
  <meta name="description" content="它认识你，它懂科研世界，它决定你此刻最值得做的一件事，陪你做完，记住结果，再给下一步。" />
  <meta name="theme-color" content="#f5f2ea" />
  <link rel="stylesheet" href="/static/css/styles.css?v=w25" />  <!-- 标题衬线字体走国内可达的镜像，且不阻塞首屏；加载失败时回退系统宋体 -->
  <link rel="preconnect" href="https://fonts.googleapis.cn" />
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" />
</head>
<body>
  <div class="boot" id="boot" aria-hidden="true">
    <p class="boot-kicker">QIYAN</p>
    <h2>启研</h2>
    <div class="boot-line"><i></i></div>
  </div>

  <div class="app-frame">
    <aside class="side-nav" id="mainNav" hidden>
      <button class="side-brand" id="brandHome" type="button" title="回到首页">启研<small>AI Research Mentor</small></button>
      <nav class="side-links" aria-label="工作区">
        <button class="nav-btn" type="button" data-view="today" data-workspace="today"><span>今日</span><small>状态与建议</small></button>
        <button class="nav-btn" type="button" data-view="onboarding" data-workspace="portrait"><span>画像</span><small>对话与核对</small></button>
        <button class="nav-btn" type="button" data-view="cards" data-workspace="cards"><span>方向</span><small>方向与教程</small></button>
        <button class="nav-btn" type="button" data-view="workbench" data-workspace="workbench"><span>任务</span><small>做到提交</small></button>
        <button class="nav-btn" type="button" data-view="projects" data-workspace="projects"><span>项目</span><small>边学边练</small></button>
        <button class="nav-btn" type="button" data-view="me" data-workspace="me"><span>记录</span><small>它记住的</small></button>
      </nav>
      <div class="side-foot" id="headerRight" hidden>
        <button class="llm-pill" id="llmPill" type="button">连接模型</button>
        <span class="user-chip"><span class="dot"></span><span id="userNickname"></span></span>
      </div>
    </aside>

    <div class="app-column">
      <main class="page" id="app">
        <!-- 各视图由 app.js 渲染 -->
      </main>
      <footer class="site-footer">
        <p>课程来自北大教务公开接口，查不到就写查不到。连接模型后，对话、方向理由、下一步和任务反馈由模型生成，失败时回退规则。</p>
      </footer>
    </div>
  </div>

  <script src="/static/js/directions.js?v=w25"></script>
  <script src="/static/js/app.js?v=w25"></script></body>
</html>
